[package]
name = "lnclient"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
data-encoding = "2.4"
rand = { version = "0.10", features = ["thread_rng"] }
prost = "0.14.4"
tonic = { version = "0.14.9", features = ["tls-aws-lc"] }
tonic-prost = "0.14.9"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }

[build-dependencies]
protox = "0.9"
tonic-prost-build = "0.14.9"
