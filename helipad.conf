##: This is a sample configuration file with some sane defaults.  Adjust to
##: your needs and remember that ENV variables always take precedence over
##: anything given here.

##: Overridden by env:HELIPAD_DATABASE_DIR
database_dir="/data/database.db"

##: Overridden by env:HELIPAD_SOUND_DIR
sound_dir="/data/sounds"

##: Overridden by env:HELIPAD_LISTEN_PORT
listen_port=2112

##: Overridden by env:HELIPAD_PASSWORD
#password=

##: Overridden by env:HELIPAD_LIGHTNING_TYPE
lightning_type="lnd" ##: lnd or cln

##: Overridden by env:LND_ADMINMACAROON
lnd_macaroon="/lnd/data/chain/bitcoin/mainnet/admin.macaroon"

##: Overridden by env:LND_TLSCERT
lnd_cert="/lnd/tls.cert"

##: Overridden by env:LND_URL
lnd_url="https://127.0.0.1:10009"

##: Overridden by env:CLN_CERT
#cln_cert="/cln/regtest/client.pem"

##: Overridden by env:CLN_KEY
#cln_key="/cln/regtest/client-key.pem"

##: Overridden by env:CLN_CACERT
#cln_cacert="/cln/regtest/ca.pem"

##: Overridden by env:CLN_URL
#cln_url="https://127.0.0.1:2105"